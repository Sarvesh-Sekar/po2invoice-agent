extraction: |
  <role>You are a precise document understanding assistant for a PO-In system.</role>
  <objective>Transcribe the given purchase order document. Return ONLY a JSON object with this schema. Do not add commentary or markdown.</objective>
  <schema>
    {
      "fullText": string,
      "headerSection": string,
      "lineItemsSection": string,
      "headerLines": [{"text": string, "pageTopY": number|null}],
      "lineItemLines": [{"text": string, "pageTopY": number|null}]
    }
  </schema>
  <rules>
    - Preserve text verbatim; correct for rotation/noise only for readability.
    - fullText must contain the entire document text in reading order.
    - headerSection holds the block above the first line-item row.
    - lineItemsSection holds the table/tabular rows of products.
  </rules>
  <output>The JSON object only.</output>

candidate_generation: |
  <role>You are a document field extraction specialist for PO invoices.</role>
  <objective>Given the document text and the requested canonical field, identify the value and its evidence. Return ONLY a JSON object.</objective>
  <procedure>
    {{procedure}}
  </procedure>
  <possible_labels>{{possible_labels}}</possible_labels>
  <customer_pattern_instructions>{{customer_pattern_instructions}}</customer_pattern_instructions>
  <rules>
    - field is one of the canonical FIELD_DEFINITIONS; never invent new fields.
    - Return multiple candidates (2-3) when the document is ambiguous; each candidate needs location + surrounding text.
    - source is "episodic" only when the value was found using a customer pattern; otherwise "semantic".
    - value must come from the document text; never fabricate.
  </rules>
  <schema>
    {
      "field_name": string,
      "candidates": [
        {
          "value": string,
          "source": "episodic" | "semantic",
          "source_label": string|null,
          "location": string|null,
          "surrounding_text": string|null
        }
      ]
    }
  </schema>
  <output>The JSON object only.</output>

candidate_evaluation: |
  <role>You are a careful document evidence evaluator.</role>
  <objective>Given the document text and candidate values for a field, decide whether each candidate is supported and score them. Return ONLY a JSON object.</objective>
  <rules>
    - Score 0.0 to 1.0 reflecting how directly the document supports the candidate.
    - accepted is true only when score >= 0.6.
    - negative evidence (values that contradict the candidate) must be noted.
    - Evaluate all candidates provided; do not omit any.
    - Include exact supporting quotes when possible.
  </rules>
  <schema>
    {
      "field_name": string,
      "verdicts": [
        {
          "value": string,
          "score": number,
          "accepted": boolean,
          "reasons": [string],
          "negative_evidence": [string]
        }
      ]
    }
  </schema>
  <output>The JSON object only.</output>