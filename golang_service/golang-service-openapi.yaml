openapi: 3.0.3
info:
  title: Business Service API
  version: 2.0.0
  description: |
    Order-to-Invoice API (ER2). Purchase order data is normalized into
    PO_HEADER_FIELDS / PO_LINE_ITEM_FIELDS keyed by FIELD_DEFINITIONS, so PO
    payloads carry field name/value pairs instead of fixed columns. PO
    approval no longer exists — a sale is created directly from a purchase
    order.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      security: []
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201': {description: User registered}
  /auth/login:
    post:
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/refresh:
    post:
      security: []
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200': {description: Token refreshed}
  /auth/logout:
    post:
      summary: Logout
      responses:
        '204': {description: Logged out}
  /auth/me:
    get:
      summary: Current user
      responses:
        '200': {description: Current user}
  /customers:
    get:
      summary: List or search customers
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Customer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /customers/{customerId}:
    parameters: [{name: customerId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Get customer
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
    patch:
      summary: Update customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
    delete:
      summary: Deactivate customer (soft delete)
      responses:
        '204': {description: Deleted}
  /products:
    get:
      summary: List or search products
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /products/{productId}:
    parameters: [{name: productId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Get product
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    patch:
      summary: Update product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /purchase-orders:
    get:
      summary: List or filter purchase orders
      parameters:
        - {name: customer_id, in: query, schema: {type: string, format: uuid}}
        - {name: search, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Purchase order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrderListItem'
    post:
      summary: Create purchase order with normalized header + line item fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderCreate'
      responses:
        '201':
          description: Purchase order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
  /purchase-orders/{poId}:
    parameters: [{name: poId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Get purchase order (with resolved header + line item fields)
      responses:
        '200':
          description: Purchase order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
    patch:
      summary: Edit purchase order (customer, s3_url, header fields)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
  /purchase-orders/{poId}/line-items:
    get:
      summary: Get PO line items
      responses:
        '200':
          description: Line items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/POLineItem'
  /purchase-orders/{poId}/line-items/{lineItemId}:
    parameters:
      - {name: poId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: lineItemId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      summary: Edit PO line item fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POLineItemUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
  /purchase-orders/{poId}/history:
    get:
      summary: PO history
      responses:
        '200': {description: History}
  /sales:
    get:
      summary: List or filter sales
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [CREATED, CONFIRMED, PROCESSING, SHIPPED, DELIVERED]}}
        - {name: customer_id, in: query, schema: {type: string, format: uuid}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Sales list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
    post:
      summary: Create sale from a purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreate'
      responses:
        '201':
          description: Sale created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
  /sales/{saleId}:
    parameters: [{name: saleId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Get sale
      responses:
        '200':
          description: Sale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
  /sales/{saleId}/status:
    parameters: [{name: saleId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Change sale status (sequential forward transitions only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleStatusUpdate'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
  /sales/{saleId}/history:
    get:
      summary: Sale history
      responses:
        '200': {description: History}
  /invoices:
    get:
      summary: List or filter invoices
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: po_id, in: query, schema: {type: string, format: uuid}}
        - {name: customer_id, in: query, schema: {type: string, format: uuid}}
        - {name: search, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Invoice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
  /invoices/{invoiceId}:
    parameters: [{name: invoiceId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Get invoice
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
  /invoices/{invoiceId}/download:
    parameters: [{name: invoiceId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Get invoice download URL
      responses:
        '200':
          description: PDF download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
  /dashboard/summary:
    get:
      summary: Dashboard summary
      responses:
        '200': {description: Summary}
  /dashboard/recent-orders:
    get:
      summary: Recent orders
      responses:
        '200': {description: Recent orders}
  /dashboard/recent-invoices:
    get:
      summary: Recent invoices
      responses:
        '200': {description: Recent invoices}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string}
        email: {type: string, format: email}
        password: {type: string, format: password}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string}
    AuthResponse:
      type: object
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, example: Bearer}
    CustomerCreate:
      type: object
      required: [customer_code, name]
      properties:
        customer_code: {type: string, maxLength: 64}
        name: {type: string, maxLength: 255}
        status: {type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE}
    CustomerUpdate:
      type: object
      properties:
        customer_code: {type: string, maxLength: 64}
        name: {type: string, maxLength: 255}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    Customer:
      type: object
      properties:
        customer_id: {type: string, format: uuid}
        customer_code: {type: string}
        name: {type: string}
        status: {type: string}
        created_at: {type: string, format: date-time}
        modified_at: {type: string, format: date-time}
    ProductCreate:
      type: object
      required: [name, sku]
      properties:
        name: {type: string, maxLength: 255}
        sku: {type: string, maxLength: 128}
        catalog_price: {type: number, format: double, minimum: 0}
        status: {type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE}
    ProductUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 255}
        sku: {type: string, maxLength: 128}
        catalog_price: {type: number, format: double, minimum: 0}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    Product:
      type: object
      properties:
        product_id: {type: string, format: uuid}
        name: {type: string}
        sku: {type: string}
        catalog_price: {type: number, format: double}
        status: {type: string}
        created_at: {type: string, format: date-time}
        modified_at: {type: string, format: date-time}
    POField:
      type: object
      required: [field_name]
      properties:
        field_id: {type: string, format: uuid}
        field_name: {type: string, maxLength: 128}
        field_value: {type: string}
    POLineItem:
      type: object
      required: [product_id]
      properties:
        po_line_item_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        product: {$ref: '#/components/schemas/Product'}
        fields:
          type: array
          items: {$ref: '#/components/schemas/POField'}
    PurchaseOrderCreate:
      type: object
      required: [customer_id, line_items]
      properties:
        customer_id: {type: string, format: uuid}
        s3_url: {type: string, maxLength: 2048}
        header_fields:
          type: array
          items: {$ref: '#/components/schemas/POField'}
        line_items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/POLineItem'}
    PurchaseOrderUpdate:
      type: object
      properties:
        customer_id: {type: string, format: uuid}
        s3_url: {type: string, maxLength: 2048}
        header_fields:
          type: array
          items: {$ref: '#/components/schemas/POField'}
    POLineItemUpdate:
      type: object
      properties:
        product_id: {type: string, format: uuid}
        fields:
          type: array
          items: {$ref: '#/components/schemas/POField'}
    PurchaseOrder:
      type: object
      properties:
        po_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        customer: {$ref: '#/components/schemas/Customer'}
        s3_url: {type: string}
        header_fields:
          type: array
          items: {$ref: '#/components/schemas/POField'}
        line_items:
          type: array
          items: {$ref: '#/components/schemas/POLineItem'}
        created_by: {type: string, format: uuid}
        modified_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        modified_at: {type: string, format: date-time}
    PurchaseOrderListItem:
      type: object
      properties:
        po_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        customer_name: {type: string}
        s3_url: {type: string}
        po_number: {type: string}
        total_amount: {type: number, format: double}
        created_at: {type: string, format: date-time}
        modified_at: {type: string, format: date-time}
    SaleCreate:
      type: object
      required: [po_id]
      properties:
        po_id: {type: string, format: uuid}
    SaleStatusUpdate:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [CONFIRMED, PROCESSING, SHIPPED, DELIVERED]}
    Sale:
      type: object
      properties:
        sale_id: {type: string, format: uuid}
        po_id: {type: string, format: uuid}
        status: {type: string, enum: [CREATED, CONFIRMED, PROCESSING, SHIPPED, DELIVERED]}
        po_number: {type: string}
        customer_name: {type: string}
        created_at: {type: string, format: date-time}
        modified_at: {type: string, format: date-time}
    Invoice:
      type: object
      properties:
        invoice_id: {type: string, format: uuid}
        po_id: {type: string, format: uuid}
        invoice_number: {type: string}
        status: {type: string}
        gst_irn: {type: string}
        s3_url: {type: string}
        created_at: {type: string, format: date-time}
        modified_at: {type: string, format: date-time}